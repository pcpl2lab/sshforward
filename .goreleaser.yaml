version: 2

before:
  hooks:
    - go mod tidy
    # Windows version resource: the .syso files are per-architecture, are not
    # committed, and carry the release tag, so they are built here rather than
    # kept in the repo. Every windows goarch below must appear in --arch.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64 --file-version {{ .Version }} --product-version {{ .Version }}

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/pcpl2/sshforward/cmd.version={{ .Version }}
      - -X github.com/pcpl2/sshforward/cmd.commit={{ .Commit }}
      - -X github.com/pcpl2/sshforward/cmd.date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
