name: Release

# Shown as the run's title in the Actions list, which otherwise reads as a
# column of identical "Release" entries with no way to tell the versions apart.
run-name: Release ${{ inputs.version }}${{ inputs.draft && ' (draft)' || '' }}

# Releases are cut on demand. The tag is created here and GoReleaser publishes
# everything from it: the GitHub release with all artifacts, the Homebrew cask
# and the Scoop manifest.
#
# GoReleaser has to own the release. Its cask and scoop pipes sit inside the
# publish stage, which is all-or-nothing in the OSS edition: skipping release
# creation would silently skip pushing the cask and the manifest as well, and
# OSS has no separate publish command to run them afterwards.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string
      draft:
        description: "Publish as a draft, to review before it goes out"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Two releases running at once would race over the tag and over dist/.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the changelog is built from history

      # The input reaches the shell through the environment, never through
      # template interpolation, so it cannot be injected into the script.
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Nothing is tagged or published before it is known to build and pass.
      - name: Verify
        run: |
          go vet ./...
          go test ./... -count=1

      # GoReleaser reads the version, the changelog range and the download URLs
      # from a real tag, so it has to exist before the build.
      - name: Create the tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      # nfpm signs the packages as it builds them, and it reads the keys from
      # files rather than the environment.
      - name: Stage the package signing keys
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APK_RSA_PRIVATE_KEY: ${{ secrets.APK_RSA_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" >"$RUNNER_TEMP/keys/gpg.asc"
          printf '%s\n' "$APK_RSA_PRIVATE_KEY" >"$RUNNER_TEMP/keys/apk.pem"
          # Alpine signs with RSA, not PGP; a swapped pair of secrets would
          # otherwise only surface as an unhelpful nfpm error.
          grep -q 'BEGIN PGP PRIVATE KEY' "$RUNNER_TEMP/keys/gpg.asc" ||
            { echo "::error::APT_GPG_PRIVATE_KEY is not an armored PGP private key"; exit 1; }
          grep -q 'BEGIN.*PRIVATE KEY' "$RUNNER_TEMP/keys/apk.pem" ||
            { echo "::error::APK_RSA_PRIVATE_KEY is not a PEM private key"; exit 1; }
          echo "GPG_KEY_FILE=$RUNNER_TEMP/keys/gpg.asc" >>"$GITHUB_ENV"
          echo "APK_KEY_FILE=$RUNNER_TEMP/keys/apk.pem" >>"$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean ${{ inputs.draft && '--draft' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask and the Scoop manifest are pushed to other repositories,
          # which GITHUB_TOKEN cannot write to. One deploy key per repository,
          # because GitHub refuses to reuse a key across repos.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          WINGET_FORK_DEPLOY_KEY: ${{ secrets.WINGET_FORK_DEPLOY_KEY }}

      # The run page otherwise says nothing about where any of this ended up.
      - name: Summarise what was published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## sshforward $VERSION"
            echo
            echo "| Channel | Where |"
            echo "| --- | --- |"
            echo "| Release | [$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION) |"
            echo "| Homebrew | pcpl2lab/homebrew-tap |"
            echo "| Scoop | pcpl2lab/scoop-bucket |"
            echo "| WinGet | pcpl2lab/winget-pkgs, branch \`sshforward-${VERSION#v}\` |"
            echo
            echo "**Manual step:** open the pull request from that WinGet branch to"
            echo "microsoft/winget-pkgs. A deploy key cannot open it."
          } >>"$GITHUB_STEP_SUMMARY"

      # A tag with no release behind it would have to be deleted by hand before
      # the version could be retried.
      - name: Remove the tag if the release did not complete
        if: failure() && steps.tag.outcome == 'success'
        env:
          VERSION: ${{ inputs.version }}
        run: git push --delete origin "$VERSION"

  # The installer ships the exact binaries that were published, downloaded back
  # from the release, rather than a rebuild that would carry a different build
  # date and never be covered by checksums.txt.
  installer:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the released Windows binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          foreach ($arch in '386', 'amd64', 'arm64') {
            $name = "sshforward_windows_$arch.zip"
            gh release download $env:VERSION --repo $env:GITHUB_REPOSITORY --pattern $name --dir zips
            if ($LASTEXITCODE -ne 0) { throw "could not download $name" }
            Expand-Archive "zips/$name" -DestinationPath "winbin/$arch"
          }

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $out = "sshforward_${version}_windows_setup"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" /DBinDir=..\winbin "/DOutputName=$out" installer\sshforward.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP_EXE=dist\$out.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach it to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload $env:VERSION $env:SETUP_EXE --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          "- Windows installer: ``$(Split-Path $env:SETUP_EXE -Leaf)``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # A macOS installer package. GoReleaser's pkg support is Pro-only, but
  # pkgbuild and productbuild ship with macOS, so this needs no dependencies.
  # A .pkg installs straight into /usr/local/bin, which is on the default PATH -
  # a .dmg would only hand the user a file to copy somewhere themselves.
  macos-pkg:
    name: macOS package
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the released macOS binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          for arch in amd64 arm64; do
            name="sshforward_darwin_${arch}.tar.gz"
            gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir tars
            mkdir -p "macbin/$arch"
            tar -xzf "tars/$name" -C "macbin/$arch"
          done

      - name: Build the package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${VERSION#v}"

          # One binary that runs natively on both Intel and Apple Silicon, so
          # the installer never asks the user which Mac they have.
          mkdir -p stage
          lipo -create -output stage/sshforward macbin/amd64/sshforward macbin/arm64/sshforward
          chmod 755 stage/sshforward
          lipo -info stage/sshforward

          pkgbuild --root stage             --identifier ovh.pcpl2lab.sshforward             --version "$version"             --install-location /usr/local/bin             component.pkg

          mkdir -p resources
          cp LICENSE resources/LICENSE.txt
          cp installer/macos/welcome.html resources/welcome.html

          mkdir -p dist
          out="dist/sshforward_${version}_macos.pkg"
          productbuild --distribution installer/macos/distribution.xml             --resources resources --package-path . "$out"
          echo "PKG=$out" >>"$GITHUB_ENV"

      - name: Check the package installs and the command runs
        run: |
          set -eu
          sudo installer -pkg "$PKG" -target /
          /usr/local/bin/sshforward version
          pkgutil --pkg-info ovh.pcpl2lab.sshforward

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          gh release upload "$VERSION" "$PKG" --repo "$GITHUB_REPOSITORY" --clobber
          echo "- macOS package: \`$(basename "$PKG")\`" >>"$GITHUB_STEP_SUMMARY"

  # Publishes the .deb packages to the APT repository on GitHub Pages, so
  # Debian and Ubuntu users get `apt upgrade` rather than a manual download.
  # GoReleaser has no APT publisher in the OSS edition; this signs and pushes
  # the repository itself.
  apt:
    name: APT repository
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the released packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p debs
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          ls -l debs

      - name: Check out the APT repository
        env:
          APT_REPO_DEPLOY_KEY: ${{ secrets.APT_REPO_DEPLOY_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$APT_REPO_DEPLOY_KEY" >~/.ssh/apt_key
          chmod 600 ~/.ssh/apt_key
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/apt_key -o StrictHostKeyChecking=accept-new -F /dev/null'
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >>"$GITHUB_ENV"
          git clone git@github.com:pcpl2lab/apt.git aptrepo

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          # Signing uses the default key, so more than one would make the choice
          # depend on import order - and clients are told to trust exactly one.
          # `gpg --export-secret-keys` without a selector exports the whole
          # keyring, which is the easy way to get this wrong.
          count=$(gpg --list-secret-keys --with-colons | grep -c '^sec:' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::APT_GPG_PRIVATE_KEY must hold exactly one secret key, found $count"
            exit 1
          fi
          gpg --list-secret-keys --keyid-format=long

      - name: Rebuild and sign the repository
        env:
          DEB_DIR: ${{ github.workspace }}/debs
          APT_URL: https://apt.pcpl2lab.ovh
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils
          cd aptrepo
          # Cloudflare Pages deploys this repository on push and takes the
          # custom domain from its own project settings, so no CNAME file and no
          # Jekyll opt-out are needed here.
          bash "$GITHUB_WORKSPACE/installer/apt/publish.sh"

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          cd aptrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An empty repository clones onto a branch whose name depends on the
          # git version and the runner's init.defaultBranch, so name it here
          # rather than letting a "master" appear where Pages expects "main".
          git checkout -B main
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "sshforward $VERSION"
          git push origin main
          echo "- APT repository: https://apt.pcpl2lab.ovh" >>"$GITHUB_STEP_SUMMARY"

  # The RPM repository, for dnf and zypper. Packages are already signed by nfpm;
  # this signs the metadata as well, so clients can run with repo_gpgcheck=1.
  rpm:
    name: RPM repository
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the released packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p rpms
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.rpm' --dir rpms
          ls -l rpms

      - name: Check out the RPM repository
        env:
          RPM_REPO_DEPLOY_KEY: ${{ secrets.RPM_REPO_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$RPM_REPO_DEPLOY_KEY" >~/.ssh/rpm_key
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/rpm_key -o StrictHostKeyChecking=accept-new -F /dev/null'
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >>"$GITHUB_ENV"
          git clone git@github.com:pcpl2lab/rpm.git rpmrepo

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          count=$(gpg --list-secret-keys --with-colons | grep -c '^sec:' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::APT_GPG_PRIVATE_KEY must hold exactly one secret key, found $count"
            exit 1
          fi

      - name: Rebuild and sign the repository
        env:
          RPM_DIR: ${{ github.workspace }}/rpms
          RPM_URL: https://rpm.pcpl2lab.ovh
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq createrepo-c
          cd rpmrepo
          bash "$GITHUB_WORKSPACE/installer/rpm/publish.sh"

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          cd rpmrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "sshforward $VERSION"
          git push origin main
          echo "- RPM repository: https://rpm.pcpl2lab.ovh" >>"$GITHUB_STEP_SUMMARY"

  # The Alpine repository. Indexing and signing need apk-tools and abuild-sign,
  # which exist only on Alpine, so that part runs in a container.
  apk:
    name: Alpine repository
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the released packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p apks
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apks
          ls -l apks

      - name: Check out the Alpine repository
        env:
          APK_REPO_DEPLOY_KEY: ${{ secrets.APK_REPO_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$APK_REPO_DEPLOY_KEY" >~/.ssh/apk_key
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/apk_key -o StrictHostKeyChecking=accept-new -F /dev/null'
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >>"$GITHUB_ENV"
          git clone git@github.com:pcpl2lab/apk.git apkrepo

      - name: Rebuild and sign the repository
        env:
          APK_RSA_PRIVATE_KEY: ${{ secrets.APK_RSA_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_RSA_PRIVATE_KEY" >"$RUNNER_TEMP/keys/apk.pem"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/apks:/pkgs:ro" \
            -v "$RUNNER_TEMP/keys:/keys:ro" \
            -v "$GITHUB_WORKSPACE/apkrepo:/repo" \
            -e APK_DIR=/pkgs \
            -e APK_URL=https://apk.pcpl2lab.ovh \
            -e APK_KEY_FILE=/keys/apk.pem \
            alpine:latest sh -c 'apk add --no-cache abuild openssl >/dev/null && cd /repo && sh /src/installer/apk/publish.sh'
          # The container writes as root; hand the tree back to the runner.
          sudo chown -R "$(id -u):$(id -g)" apkrepo

      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          cd apkrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "sshforward $VERSION"
          git push origin main
          echo "- Alpine repository: https://apk.pcpl2lab.ovh" >>"$GITHUB_STEP_SUMMARY"
